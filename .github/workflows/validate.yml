name: Validate report examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  report-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: validation/requirements.txt
      - run: python -m pip install -r validation/requirements.txt
      - run: python validation/check_report_examples.py
